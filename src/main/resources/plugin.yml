name: LittleBiomes
main: dev.lumas.biomes.LittleBiomes
version: '1.0-SNAPSHOT'
api-version: 1.21
folia-supported: true
softdepend:
  - RealisticSeasons
  - WorldGuard
  - ProtocolLib
  - Foliage
commands:
  littlebiomes:
    description: Main command for LittleBiomes plugin.
    usage: /<command>
  pbiome:
    description: Toggle your personal biome, or open the menu to store an anchor in.
    usage: /<command> [anchor]
permissions:
  littlebiomes.command.pbiome:
    description: Toggle your personal biome on and off.
    default: op
  littlebiomes.command.pbiome.anchor:
    description: Open the personal biome anchor menu.
    default: op
